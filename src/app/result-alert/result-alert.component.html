<p class="result-text">{{ result }}</p>

<div class="angpao-container">
    <div class="bills-container" *ngIf="roundMoney > 0">
        <span class="bill bill-1">💵</span>
        <span class="bill bill-2">💵</span>
        <span class="bill bill-3">💵</span>
        <span class="bill bill-4">💸</span>
        <span class="bill bill-5">💸</span>
    </div>
    <p class="money-earned" [class.no-money]="roundMoney === 0">
        <span *ngIf="roundMoney > 0">+${{ roundMoney }}</span>
        <span *ngIf="roundMoney === 0">$0</span>
    </p>
</div>
